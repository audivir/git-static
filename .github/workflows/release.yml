name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            asset: macos-arm64
          - os: ubuntu-latest
            asset: linux-amd64
          - os: ubuntu-24.04-arm
            asset: linux-arm64
          - os: ubuntu-latest
            asset: linux-musl-amd64
            static: true
          - os: ubuntu-24.04-arm
            asset: linux-musl-arm64
            static: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
      - name: Install autotools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool
      - name: Install autotools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool
      - run: ./build.sh ${{ matrix.static && '--static' || '' }}
      - name: Package git
        run: |
          dist="dist${{ matrix.static && '-static' || '' }}"
          tar -czf git-static-${{ matrix.asset }}.tar.gz -C "$dist" bin libexec share
      - name: Collect sources
        if: matrix.asset == 'linux-amd64'
        run: tar -czf git-static-sources.tar.gz --exclude=.git vendor
      - uses: actions/upload-artifact@v7
        with:
          name: git-static-${{ matrix.asset }}
          path: git-static-*.tar.gz
          retention-days: 1
  release:
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: git-static-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
